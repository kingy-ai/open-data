name: Sync AI Deadlines

on:
  schedule:
    - cron: '11,26,41,56 * * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/*deadlines*.mjs'
      - '.github/workflows/sync-deadlines.yml'

permissions:
  contents: read

concurrency:
  group: deadlines-sync-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Test holds, clocks, no-op behavior and atomic publication
        run: node --test scripts/deadlines.test.mjs

  sync:
    needs: validate
    if: github.repository == 'kingy-ai/open-data' && github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      DEADLINES_SYNC_RECEIPT: ${{ runner.temp }}/deadlines-sync.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Fetch and validate the canonical reviewed catalog
        id: export
        run: node scripts/export-deadlines.mjs
      - name: Validate all exported fields, dates, holds, archives and checksums
        run: node scripts/validate-deadlines.mjs
      - name: Publish validated changes atomically and verify raw readback
        if: steps.export.outputs.changed == 'true'
        run: node scripts/publish-deadlines.mjs
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Log the synchronization receipt
        if: success()
        run: cat "$DEADLINES_SYNC_RECEIPT"
